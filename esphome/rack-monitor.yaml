# =============================================================
# ha-rack-monitor (c) dan1elw
# https://github.com/dan1elw/ha-rack-monitor
# version 1.1
# =============================================================
# Rack-Controller – ESP32-WROOM-32 DevKitC (38-Pin)
# Temperaturüberwachung (DS18B20) + PWM-Lüftersteuerung (Delta-T)
# Anbindung: Home Assistant via native ESPHome-API
# =============================================================
# Pinbelegung:
#   GPIO4   1-Wire-Bus DS18B20 (4,7 kΩ Pull-up extern)
#   GPIO13  Status-LED grün (220 Ω)
#   GPIO21  I²C SDA – reserviert (Sensor noch nicht konfiguriert)
#   GPIO22  I²C SCL – reserviert
#   GPIO25  PWM Lüfter 1 (25 kHz, via Level-Shifter)
#   GPIO26  PWM Lüfter 2 (25 kHz, via Level-Shifter)
#   GPIO32  Tacho Lüfter 1 (10 kΩ Pull-up extern)
#   GPIO33  Tacho Lüfter 2 (10 kΩ Pull-up extern)
# =============================================================
 
esphome:
  name: rack-monitor
  friendly_name: Rack Monitor
 
esp32:
  board: esp32dev
  framework:
    type: arduino
 
logger:
 
# ---------- Konnektivität ----------
# API-Key ist gerätespezifisch und bleibt bewusst inline
# (nicht in secrets.yaml auslagern).
api:
  encryption:
    key: "HIER_VOM_ASSISTENTEN_GENERIERTEN_KEY_EINFUEGEN"
 
ota:
  - platform: esphome
    password: !secret ota_password
 
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Rack-Monitor Fallback"
    password: !secret fallback_password
 
captive_portal:
 
# Weboberfläche zur Direktdiagnose: http://<IP>
web_server:
  port: 80
 
# ---------- Globale Variablen ----------
globals:
  # true, während die Automatik die Fan-Entitäten schreibt
  # -> verhindert, dass sie ihren eigenen manuellen Override auslöst
  - id: auto_writing
    type: bool
    initial_value: 'false'
 
# ---------- Busse ----------
one_wire:
  - platform: gpio
    pin: GPIO4
 
# ---------- Sensoren ----------
sensor:
  # DS18B20 – feste ROM-Adressen verhindern Entitäten-Tausch nach Reboot
  - platform: dallas_temp
    address: 0x2e0000006c76c428
    id: rack_temp_1
    name: "Rack Temp 1"
    update_interval: 15s
 
  - platform: dallas_temp
    address: 0x9a0000006bd8df28
    id: rack_temp_2
    name: "Rack Temp 2"
    update_interval: 15s
 
  - platform: dallas_temp
    address: 0x990000006bf7c528
    id: intake_temp
    name: "Intake Temp"
    update_interval: 15s
 
  # Regelgröße: ΔT = heißester Rack-Sensor − Zuluft (für HA-Tuning sichtbar)
  - platform: template
    name: "Rack Delta T"
    id: rack_delta_t
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float rack = fmaxf(id(rack_temp_1).state, id(rack_temp_2).state);
      if (isnan(rack) || isnan(id(intake_temp).state)) return NAN;
      return rack - id(intake_temp).state;
 
  # Tacho: Arctic P12 Pro = 2 Impulse/Umdrehung -> Faktor 0,5
  - platform: pulse_counter
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
    internal_filter: 13us
    name: "Luefter 1 Drehzahl"
    unit_of_measurement: "RPM"
    icon: mdi:fan
    filters:
      - multiply: 0.5
    update_interval: 10s
 
  - platform: pulse_counter
    pin:
      number: GPIO33
      mode: INPUT_PULLUP
    internal_filter: 13us
    name: "Luefter 2 Drehzahl"
    unit_of_measurement: "RPM"
    icon: mdi:fan
    filters:
      - multiply: 0.5
    update_interval: 10s
 
  # ---------- Diagnose ----------
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
 
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
 
  # Chip-Temperatur des ESP32 (nicht Rack-Temperatur)
  - platform: internal_temperature
    name: "ESP32 Temperatur"
    update_interval: 60s
 
# ---------- PWM-Ausgänge ----------
# 25 kHz gemäß Intel-4-Pin-Spezifikation (Arctic P12 Pro: 21–28 kHz)
output:
  - platform: ledc
    pin: GPIO25
    frequency: 25000 Hz
    id: pwm_fan1
 
  - platform: ledc
    pin: GPIO26
    frequency: 25000 Hz
    id: pwm_fan2
 
# ---------- Lüfter-Entitäten ----------
# Automatik steuert AUSSCHLIESSLICH über diese Entitäten (make_call),
# nie direkt über die Outputs -> HA-Zustand bleibt immer synchron.
# RESTORE_DEFAULT_ON: nach Stromausfall sicherer Zustand (Lüfter an),
# Automatik übernimmt spätestens nach 15 s.
# Manueller Override: jede manuelle Bedienung (HA/Web) deaktiviert die
# Automatik. Ignoriert werden Automatik-Zugriffe (auto_writing) und der
# Boot-Restore (erste 10 s).
fan:
  - platform: speed
    output: pwm_fan1
    name: "Luefter 1"
    id: fan1
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          if (!id(auto_writing) && millis() > 10000) id(auto_mode).turn_off();
    on_turn_off:
      - lambda: |-
          if (!id(auto_writing) && millis() > 10000) id(auto_mode).turn_off();
    on_speed_set:
      - lambda: |-
          if (!id(auto_writing) && millis() > 10000) id(auto_mode).turn_off();
 
  - platform: speed
    output: pwm_fan2
    name: "Luefter 2"
    id: fan2
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          if (!id(auto_writing) && millis() > 10000) id(auto_mode).turn_off();
    on_turn_off:
      - lambda: |-
          if (!id(auto_writing) && millis() > 10000) id(auto_mode).turn_off();
    on_speed_set:
      - lambda: |-
          if (!id(auto_writing) && millis() > 10000) id(auto_mode).turn_off();
 
# ---------- Schalter ----------
switch:
  # Automatik AN = Lüfterkurve aktiv; AUS = manuelle Steuerung via HA
  - platform: template
    name: "Luefter Automatik"
    id: auto_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
 
  # Status-LED (intern, nicht in HA sichtbar)
  - platform: gpio
    pin: GPIO13
    id: led_status_gruen
    internal: true
    restore_mode: ALWAYS_OFF
 
# ---------- Regelung ----------
# Variante C – Hybrid:
#   Primär:   ΔT-Regelung   Ein >= 4 K, Aus < 3 K (1 K Hysterese),
#             linear 20–100 % im Bereich 4–12 K
#   Fallback: Absolutkurve  Ein >= 28 °C, Aus < 27 °C,
#             linear 20–100 % im Bereich 28–38 °C (falls Zuluftsensor NaN)
#   Override: >= 38 °C absolut -> fest 100 % (Sicherheitsnetz)
interval:
  - interval: 15s
    then:
      - lambda: |-
          if (!id(auto_mode).state) return;
 
          // fmaxf ignoriert NaN: ein toter Rack-Sensor blockiert die Regelung nicht
          float rack = fmaxf(id(rack_temp_1).state, id(rack_temp_2).state);
          if (isnan(rack)) return;  // beide Rack-Sensoren tot: letzter Zustand bleibt
          float tin = id(intake_temp).state;
 
          static bool fans_on = false;
          float pwm = 0.0f;
 
          if (!isnan(tin)) {
            float dt = rack - tin;
            if (fans_on ? (dt > 3.0f) : (dt >= 4.0f)) {
              pwm = 0.2f + 0.8f * (dt - 4.0f) / 8.0f;
            }
          } else {
            if (fans_on ? (rack > 27.0f) : (rack >= 28.0f)) {
              pwm = 0.2f + 0.8f * (rack - 28.0f) / 10.0f;
            }
          }
 
          if (rack >= 38.0f) pwm = 1.0f;
 
          fans_on = pwm > 0.0f;
          pwm = fans_on ? clamp(pwm, 0.2f, 1.0f) : 0.0f;
 
          // Steuerung über die Fan-Entitäten -> HA zeigt korrekten Zustand.
          // auto_writing verhindert, dass die eigenen Zugriffe den
          // manuellen Override auslösen.
          id(auto_writing) = true;
          for (auto *f : {id(fan1), id(fan2)}) {
            auto call = f->make_call();
            if (fans_on) {
              call.set_state(true);
              call.set_speed((int) roundf(pwm * 100.0f));
            } else {
              call.set_state(false);
            }
            call.perform();
          }
          id(auto_writing) = false;
 
  # LED: blinkt = kein WLAN, an = Automatik aktiv, aus = manuell
  - interval: 500ms
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - switch.toggle: led_status_gruen
          else:
            - if:
                condition:
                  switch.is_on: auto_mode
                then:
                  - switch.turn_on: led_status_gruen
                else:
                  - switch.turn_off: led_status_gruen
 
# ---------- Diagnose ----------
binary_sensor:
  - platform: status
    name: "Rack Monitor Status"
 
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
 
# Neustart aus HA ohne physischen Zugriff
button:
  - platform: restart
    name: "Rack Monitor Neustart"
