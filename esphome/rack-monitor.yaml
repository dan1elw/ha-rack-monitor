# =============================================================
# ha-rack-monitor (c) dan1elw
# https://github.com/dan1elw/ha-rack-monitor
# version 1.0
# =============================================================
# Rack-Controller – ESP32-WROOM-32 DevKitC (38-Pin)
# Funktion: Temperaturüberwachung + PWM-Lüftersteuerung
# Integration: Home Assistant via native API (ESPHome)
# =============================================================
# Pinbelegung (finalisiert):
#   GPIO4   1-Wire-Bus (DS18B20, 4,7 kΩ Pull-up extern)
#   GPIO21  I²C SDA (BME280)
#   GPIO22  I²C SCL (BME280)
#   GPIO25  PWM Lüfter 1 (über Level-Shifter, 25 kHz)
#   GPIO26  PWM Lüfter 2 (über Level-Shifter, 25 kHz)
#   GPIO32  Tacho Lüfter 1 (10 kΩ Pull-up extern)
#   GPIO33  Tacho Lüfter 2 (10 kΩ Pull-up extern)
# =============================================================

esphome:
  name: rack-monitor
  friendly_name: Rack Monitor
 
esp32:
  board: esp32dev
  framework:
    type: arduino
 
logger:

# ---------- Konnektivitaet ----------
# Native Home-Assistant-API. Geraetespezifischer Key - inline,
# NICHT in secrets.yaml auslagern
api:
  encryption:
    key: "HIER_VOM_ASSISTENTEN_GENERIERTEN_KEY_EINFUEGEN"

ota:
  - platform: esphome
    password: !secret ota_password
 
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Rack-Monitor Fallback"
    password: !secret fallback_password
 
captive_portal:

# Weboberflaeche zur Direktdiagnose unter http://<IP>
web_server:
  port: 80

# ---------- Busse ----------
one_wire:
  - platform: gpio
    pin: GPIO4        # 4,7-kOhm-Pull-up extern vorhanden

# ---------- Sensoren ----------
sensor:
  # DS18B20 - Punktmessungen (ROM-Adressen aus dem Boot-Log)
  - platform: dallas_temp
    address: 0x2e0000006c76c428
    id: rack_temp_1
    name: "Rack Temp 1"
    update_interval: 15s
 
  - platform: dallas_temp
    address: 0x9a0000006bd8df28
    id: rack_temp_2
    name: "Rack Temp 2"
    update_interval: 15s

  - platform: dallas_temp
    address: 0x990000006bf7c528
    id: intake_temp
    name: "Intake Temp"
    update_interval: 15s

  - platform: template
    name: "Rack Delta T"
    id: rack_delta_t
    unit_of_measurement: "K"
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      float rack = max(id(rack_temp_1).state, id(rack_temp_2).state);
      if (isnan(rack) || isnan(id(intake_temp).state)) return NAN;
      return rack - id(intake_temp).state;
 
  # Tachosignale - Arctic P12 Pro liefert 2 Impulse pro Umdrehung
  - platform: pulse_counter
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: false   # externe 10-kOhm-Pull-ups vorhanden
    name: "Luefter 1 Drehzahl"
    unit_of_measurement: "RPM"
    icon: mdi:fan
    filters:
      - multiply: 0.5   # Impulse/min -> U/min
    update_interval: 10s
 
  - platform: pulse_counter
    pin:
      number: GPIO33
      mode:
        input: true
        pullup: false
    name: "Luefter 2 Drehzahl"
    unit_of_measurement: "RPM"
    icon: mdi:fan
    filters:
      - multiply: 0.5
    update_interval: 10s
 
  # --- Diagnose-Sensoren ---
  # Uptime: springt bei jedem Reboot auf 0 -> ideal zur Verifikation,
  # ob die Spannungseinbrueche nach Elko-Einbau wirklich weg sind.
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
 
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
 
  # Interne Chip-Temperatur des ESP32 (nicht die Rack-Temperatur)
  - platform: internal_temperature
    name: "ESP32 Temperatur"
    update_interval: 60s
 
# ---------- PWM-Ausgaenge ----------
# Intel-Spezifikation fuer 4-Pin-PWM: 25 kHz
# Arctic P12 Pro: Zielfrequenz 25 kHz, Bereich 21-28 kHz -> passt
output:
  - platform: ledc
    pin: GPIO25
    frequency: 25000 Hz
    id: pwm_fan1
 
  - platform: ledc
    pin: GPIO26
    frequency: 25000 Hz
    id: pwm_fan2
 
# ---------- Luefter-Entitaeten ----------
# RESTORE_DEFAULT_ON: nach Stromausfall laufen Luefter an, nicht aus
fan:
  - platform: speed
    output: pwm_fan1
    name: "Luefter 1"
    id: fan1
    restore_mode: RESTORE_DEFAULT_ON
 
  - platform: speed
    output: pwm_fan2
    name: "Luefter 2"
    id: fan2
    restore_mode: RESTORE_DEFAULT_ON
 
# ---------- Automatikmodus (Luefterkurve) ----------
# Aus = manuelle Steuerung ueber die Fan-Entitaeten
switch:
  - platform: template
    name: "Luefter Automatik"
    id: auto_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    pin: GPIO13
    id: led_status_gruen
    internal: true          # taucht nicht in HA auf
    restore_mode: ALWAYS_OFF

interval:
  - interval: 15s
    then:
      - lambda: |-
          if (!id(auto_mode).state) return;

          float t1 = id(rack_temp_1).state;
          float t2 = id(rack_temp_2).state;
          float tin = id(intake_temp).state;
          float rack = max(t1, t2);
          if (isnan(rack)) return;  // beide Rack-Sensoren tot: keine Änderung

          static bool fans_on = false;
          float pwm = 0.0f;

          if (!isnan(tin)) {
            // Primär: Delta-T-Regelung
            float dt = rack - tin;
            const float DT_ON = 4.0f, DT_OFF = 3.0f, DT_MAX = 12.0f;
            if (fans_on ? (dt > DT_OFF) : (dt >= DT_ON)) {
              pwm = 0.2f + 0.8f * (dt - DT_ON) / (DT_MAX - DT_ON);
            }
          } else {
            // Fallback: Absolutkurve (bisherige Logik)
            if (rack >= 28.0f) {
              pwm = 0.2f + 0.8f * (rack - 28.0f) / 10.0f;
            }
          }

          // Absolut-Override (Sicherheitsnetz)
          if (rack >= 38.0f) pwm = 1.0f;

          pwm = clamp(pwm, 0.0f, 1.0f);
          fans_on = pwm > 0.0f;

          id(pwm_fan1).set_level(pwm);
          id(pwm_fan2).set_level(pwm);
  - interval: 500ms
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - switch.toggle: led_status_gruen
          else:
            - if:
                condition:
                  switch.is_on: auto_mode
                then:
                  - switch.turn_on: led_status_gruen
                else:
                  - switch.turn_off: led_status_gruen
 
# ---------- Diagnose ----------
binary_sensor:
  - platform: status
    name: "Rack Monitor Status"
 
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
 
# Neustart aus Home Assistant heraus, ohne physischen Zugriff
button:
  - platform: restart
    name: "Rack Monitor Neustart"